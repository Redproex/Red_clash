<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 15px;
    font-family: Arial, sans-serif;
    background: #eeeeee;
    color: #222;
}

h1 {
    text-align: center;
    font-size: 24px;
}

.subtitle {
    text-align: center;
    font-size: 14px;
}

.title {
    text-align: center;
    font-size: 18px;
    margin: 18px 0 8px;
}

.sheet {
    width: 100%;
    max-width: 1100px;
    margin: 0 auto 25px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    background: white;
    border: 2px solid #222;
}

.panel {
    min-height: 420px;
    padding: 16px;
    border-right: 1px dashed #777;
}

.panel:last-child {
    border-right: none;
}

.panel h2 {
    text-align: center;
    font-size: 17px;
    margin: 5px 0 14px;
}

.panel h3 {
    font-size: 14px;
}

.panel p,
.panel li {
    font-size: 11px;
    line-height: 1.45;
}

.panel ul {
    padding-left: 18px;
}

.cover {
    text-align: center;
    padding-top: 35px;
}

.tesla {
    font-size: 36px;
    font-weight: bold;
    margin: 12px 0;
}

.car {
    font-size: 45px;
    text-align: center;
    margin: 12px;
}

.fold {
    text-align: center;
    color: #777;
    font-size: 9px;
    margin-top: 15px;
}

.note {
    max-width: 850px;
    margin: auto;
    background: white;
    padding: 15px;
    font-size: 12px;
}

.note h2 {
    font-size: 16px;
}

.note p {
    margin: 6px 0;
}

@media (max-width: 800px) {
    .sheet {
        grid-template-columns: 1fr;
    }

    .panel {
        border-right: none;
        border-bottom: 1px dashed #777;
        min-height: 280px;
    }

    .panel:last-child {
        border-bottom: none;
    }
}
   </style>
